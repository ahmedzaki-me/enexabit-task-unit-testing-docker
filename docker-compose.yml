version: "3.8"

services:
  json-server-backend:
    image: node:20-alpine
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "3001:3001"
    command: npx json-server --watch db.json --host 0.0.0.0 --port 3001

  react-frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - json-server-backend
